<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 292" width="460" height="292">
  <defs>
    <style>
      @keyframes rowFadeIn {
        0% { opacity: 0; transform: translateX(-6px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .term-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #8B949E; }
      .term-code { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 12px; }
      .key-text { fill: #8B949E; font-weight: 500; }
      .val-text { fill: #C9D1D9; font-weight: 600; }
      .accent-text { fill: #38BDF8; font-weight: 600; }
      .prompt-symbol { fill: #27C93F; font-weight: 700; }
    </style>
  </defs>

  <!-- Terminal Frame -->
  <rect x="0" y="0" width="460" height="292" rx="10" ry="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <!-- Window Control Buttons -->
  <circle cx="20" cy="18" r="5" fill="#FF5F56" />
  <circle cx="36" cy="18" r="5" fill="#FFBD2E" />
  <circle cx="52" cy="18" r="5" fill="#27C93F" />
  <text x="230.0" y="22" text-anchor="middle" class="term-header">sysinfo --verbose</text>
  <line x1="0" y1="36" x2="460" y2="36" stroke="#30363D" stroke-width="1" />

  <g transform="translate(20, 56)">
    <g transform="translate(0, 12)" opacity="0" style="animation: rowFadeIn 0.35s ease-out 0.0s forwards;">
      <text x="0" y="0" class="term-code prompt-symbol">&#x276F;</text>
      <text x="16" y="0" class="term-code key-text">user:</text>
      <text x="96" y="0" class="term-code val-text">thesuraj01 (Suraj Kumar Yadav)</text>
    </g>
    <g transform="translate(0, 40)" opacity="0" style="animation: rowFadeIn 0.35s ease-out 0.15s forwards;">
      <text x="0" y="0" class="term-code prompt-symbol">&#x276F;</text>
      <text x="16" y="0" class="term-code key-text">role:</text>
      <text x="96" y="0" class="term-code accent-text">Software Engineer @ Spotline, Inc.</text>
    </g>
    <g transform="translate(0, 68)" opacity="0" style="animation: rowFadeIn 0.35s ease-out 0.3s forwards;">
      <text x="0" y="0" class="term-code prompt-symbol">&#x276F;</text>
      <text x="16" y="0" class="term-code key-text">focus:</text>
      <text x="96" y="0" class="term-code val-text">AI &amp; ML · Systems Architecture</text>
    </g>
    <g transform="translate(0, 96)" opacity="0" style="animation: rowFadeIn 0.35s ease-out 0.45s forwards;">
      <text x="0" y="0" class="term-code prompt-symbol">&#x276F;</text>
      <text x="16" y="0" class="term-code key-text">stack:</text>
      <text x="96" y="0" class="term-code val-text">Python · TypeScript · React · Next.js · Go · Rust</text>
    </g>
    <g transform="translate(0, 124)" opacity="0" style="animation: rowFadeIn 0.35s ease-out 0.6s forwards;">
      <text x="0" y="0" class="term-code prompt-symbol">&#x276F;</text>
      <text x="16" y="0" class="term-code key-text">now:</text>
      <text x="96" y="0" class="term-code accent-text">Building Agentic-RAG &amp; Multi-Agent Systems</text>
    </g>
    <g transform="translate(0, 152)" opacity="0" style="animation: rowFadeIn 0.35s ease-out 0.75s forwards;">
      <text x="0" y="0" class="term-code prompt-symbol">&#x276F;</text>
      <text x="16" y="0" class="term-code key-text">location:</text>
      <text x="96" y="0" class="term-code val-text">India</text>
    </g>
    <g transform="translate(0, 180)" opacity="0" style="animation: rowFadeIn 0.35s ease-out 0.9s forwards;">
      <text x="0" y="0" class="term-code prompt-symbol">&#x276F;</text>
      <text x="16" y="0" class="term-code key-text">links:</text>
      <text x="96" y="0" class="term-code val-text">surajkumaryadavin.vercel.app · github.com/thesuraj01</text>
    </g>
    <g transform="translate(0, 208)" opacity="0" style="animation: rowFadeIn 0.35s ease-out 1.05s forwards;">
      <text x="0" y="0" class="term-code prompt-symbol">&#x276F;</text>
      <text x="16" y="0" class="term-code val-text">status: active</text>
      <rect x="116" y="-10" width="7" height="13" fill="#38BDF8" style="animation: cursorBlink 1s infinite;" />
    </g>
  </g>
</svg>