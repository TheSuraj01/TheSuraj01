<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 379 413" width="379" height="413">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.2" />
    </pattern>
    <style>
      @keyframes fadeInRow {
        0% { opacity: 0; transform: translateY(-3px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes glitch {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 1px) }
        40% { transform: translate(-1px, -1px) }
        60% { transform: translate(2px, 1px) }
        80% { transform: translate(1px, -1px) }
        100% { transform: translate(0) }
      }
      .ascii-text { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 11px; font-weight: 700; fill: #00f3ff; white-space: pre; filter: url(#neonGlow); }
      .header-title { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 12px; font-weight: 700; fill: #f000ff; letter-spacing: 1px; filter: url(#neonGlow); }
    </style>
  </defs>

  <!-- Cyberpunk Window Frame -->
  <rect x="0" y="0" width="379" height="413" rx="4" ry="4" fill="#050510" stroke="#9d4edd" stroke-width="2" filter="url(#neonGlow)" />
  <rect x="0" y="0" width="379" height="413" rx="4" ry="4" fill="url(#scanlines)" />

  <!-- HUD Controls -->
  <path d="M 15 12 L 25 12 L 30 18 L 40 18" stroke="#00f3ff" stroke-width="2" fill="none" filter="url(#neonGlow)" />
  <path d="M 339 18 L 349 18 L 354 12 L 364 12" stroke="#f000ff" stroke-width="2" fill="none" filter="url(#neonGlow)" />
  <text x="189.5" y="22" text-anchor="middle" class="header-title" style="animation: glitch 4s infinite;">TARGET_IDENT :: VERIFIED</text>
  <line x1="0" y1="36" x2="379" y2="36" stroke="#9d4edd" stroke-width="1" stroke-dasharray="4 2" />

  <!-- Animated ASCII Content -->
  <g transform="translate(24, 56)">
    <text x="0" y="10" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.0s forwards;">                                              </text>
    <text x="0" y="23" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.04s forwards;">                                              </text>
    <text x="0" y="37" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.08s forwards;">                                              </text>
    <text x="0" y="50" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.12s forwards;">                                              </text>
    <text x="0" y="64" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.16s forwards;">                       &apos;                      </text>
    <text x="0" y="77" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.2s forwards;">                   ,~****~,                   </text>
    <text x="0" y="91" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.24s forwards;">                  :***xx***:                  </text>
    <text x="0" y="104" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.28s forwards;">                 :XXxXXXXXxX:                 </text>
    <text x="0" y="118" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.32s forwards;">                ,:O*+x~~**+O;,&apos;               </text>
    <text x="0" y="131" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.36s forwards;">                ,:OOXXXXXXXO:,                </text>
    <text x="0" y="145" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.4s forwards;">                  ~O#OOOO#O+                  </text>
    <text x="0" y="158" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.44s forwards;">                   &apos;;xXXX~.                   </text>
    <text x="0" y="172" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.48s forwards;">                  &apos;.,xOOx,.&apos;                  </text>
    <text x="0" y="185" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.52s forwards;">              &apos;:+xOO#OOOO##OX*:&apos;              </text>
    <text x="0" y="199" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.56s forwards;">            &apos;~X##OOOOOOOOOOOOO#X+&apos;            </text>
    <text x="0" y="212" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.6s forwards;">           :X#OOOOOOOOOOOOOOOOOO#O;           </text>
    <text x="0" y="226" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.64s forwards;">          ;#OOOOOOOOOOOOOOOOOOOOOO#~          </text>
    <text x="0" y="239" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.68s forwards;">         .OOOOOOOOOOOOOOOOOOOOOOOOO#:         </text>
    <text x="0" y="253" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.72s forwards;">         +OOOOOOOOOOOOOOOOOOOOOOOOOO*         </text>
    <text x="0" y="266" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.76s forwards;">         xOOOx:;;;;;;;;;;;;;;;;:*OOOX         </text>
    <text x="0" y="280" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.8s forwards;">         +#X#:~x**************x+,OOO*         </text>
    <text x="0" y="293" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.84s forwards;">         &apos;OOx.XXXXXXXXXXXXXXXXXO,*OO.         </text>
    <text x="0" y="307" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.88s forwards;">          ,#;:OxXXXXXXXXXXXXXXxX;:#:          </text>
    <text x="0" y="320" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.92s forwards;">           ..*XXXXXXXXXXXXXXXXXXx.,           </text>
    <text x="0" y="334" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.96s forwards;">            .********************,            </text>
  </g>
</svg>