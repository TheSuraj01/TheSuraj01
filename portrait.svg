<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 379 413" width="379" height="413">
  <defs>
    <style>
      @keyframes fadeInRow {
        0% { opacity: 0; transform: translateY(-3px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .ascii-text { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 11px; font-weight: 600; fill: #38BDF8; white-space: pre; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #8B949E; }
    </style>
  </defs>

  <!-- Outer Terminal Window Frame -->
  <rect x="0" y="0" width="379" height="413" rx="10" ry="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" fill="#FF5F56" />
  <circle cx="36" cy="18" r="5" fill="#FFBD2E" />
  <circle cx="52" cy="18" r="5" fill="#27C93F" />
  <text x="189.5" y="22" text-anchor="middle" class="header-title">portrait.ascii</text>
  <line x1="0" y1="36" x2="379" y2="36" stroke="#30363D" stroke-width="1" />

  <!-- Animated ASCII Content -->
  <g transform="translate(24, 56)">
    <text x="0" y="10" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.0s forwards;">                                              </text>
    <text x="0" y="23" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.04s forwards;">                                              </text>
    <text x="0" y="37" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.08s forwards;">                                              </text>
    <text x="0" y="50" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.12s forwards;">                                              </text>
    <text x="0" y="64" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.16s forwards;">                       &apos;                      </text>
    <text x="0" y="77" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.2s forwards;">                   ,~****~,                   </text>
    <text x="0" y="91" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.24s forwards;">                  :***xx***:                  </text>
    <text x="0" y="104" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.28s forwards;">                 :XXxXXXXXxX:                 </text>
    <text x="0" y="118" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.32s forwards;">                ,:O*+x~~**+O;,&apos;               </text>
    <text x="0" y="131" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.36s forwards;">                ,:OOXXXXXXXO:,                </text>
    <text x="0" y="145" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.4s forwards;">                  ~O#OOOO#O+                  </text>
    <text x="0" y="158" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.44s forwards;">                   &apos;;xXXX~.                   </text>
    <text x="0" y="172" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.48s forwards;">                  &apos;.,xOOx,.&apos;                  </text>
    <text x="0" y="185" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.52s forwards;">              &apos;:+xOO#OOOO##OX*:&apos;              </text>
    <text x="0" y="199" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.56s forwards;">            &apos;~X##OOOOOOOOOOOOO#X+&apos;            </text>
    <text x="0" y="212" class="ascii-text" opacity="0" style="animation: fadeInRow 0.3s ease-out 0.6s forwards;">           :X#OOOOOOOOOOOOOOOOOO#O;           </text>
