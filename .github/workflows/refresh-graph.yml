name: Daily Graph Refresh

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  refresh-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r tools/requirements-daily.txt

      - name: Fetch Contributions & Render Graph
        run: |
          python tools/pull_contributions.py
          python tools/render_graph.py

      - name: Commit Updated Graph & Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph [skip ci]"
          file_pattern: "assets/contributions.json graph.svg"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
